```yaml
name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo ">>> Masuk ke direktori backend"
            cd /var/mydrive/Backend-MewDrive

            echo ">>> Pull latest code dari main"
            git pull origin main

            echo ">>> Install dependencies (production only)"
            npm ci --omit=dev

            echo ">>> Jalankan migrasi database"
            NODE_ENV=production node src/database/migrate.js

            echo ">>> Reload backend tanpa downtime"
            pm2 reload mydrive-backend --update-env

            echo ">>> Simpan state PM2"
            pm2 save

            echo ">>> Deploy backend selesai!"
```